<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Capture Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      background: #16213e;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .filename {
      font-size: 14px;
      font-weight: 500;
      margin-right: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 300px;
    }

    .dimensions {
      font-size: 12px;
      color: #aaa;
      margin-right: auto;
      white-space: nowrap;
    }

    .btn {
      background: #0f3460;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #1a4a8a;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-zoom {
      background: #0f3460;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-zoom:hover {
      background: #1a4a8a;
    }

    .zoom-display {
      font-size: 13px;
      min-width: 40px;
      text-align: center;
      color: #ccc;
    }

    .preview-area {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-area.fit img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .preview-area.zoomed {
      align-items: flex-start;
      justify-content: flex-start;
      cursor: grab;
    }

    .preview-area.zoomed img {
      margin: auto;
      flex-shrink: 0;
    }

    .preview-area.dragging {
      cursor: grabbing;
      user-select: none;
    }

    #preview-image {
      display: block;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="filename" id="filename">capture.png</span>
    <span class="dimensions" id="dimensions"></span>
    <button class="btn" id="btn-copy">Copy to Clipboard</button>
    <button class="btn" id="btn-download">Download</button>
    <div class="zoom-controls">
      <button class="btn-zoom" id="btn-zoom-out">−</button>
      <span class="zoom-display" id="zoom-display">Fit</span>
      <button class="btn-zoom" id="btn-zoom-in">+</button>
      <button class="btn-zoom" id="btn-zoom-reset">Reset</button>
    </div>
  </div>
  <div class="preview-area fit">
    <img id="preview-image" alt="Preview">
  </div>
  <script src="preview.js"></script>
</body>
</html>
